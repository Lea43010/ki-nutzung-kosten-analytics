version: 2

# Tests: prüfen automatisch, ob die Daten stimmen.
# severity: warn heißt: Das Problem wird gemeldet, die Verarbeitung läuft weiter.
# Die vier bewusst eingebauten Datenfehler erscheinen so als sichtbare Warnungen.

models:
  - name: stg_departments
    description: "Abteilungen des Unternehmens (bereinigte Stammdaten)."
    columns:
      - name: department_id
        data_tests: [unique, not_null]

  - name: stg_ai_models
    description: "KI-Modelle mit ihren Preisen je 1.000 Eingabe- und Ausgabe-Token."
    columns:
      - name: model_id
        data_tests: [unique, not_null]

  - name: stg_users
    description: "Nutzer mit Abteilung, Eintritts- und Austrittsdatum."
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: department_id
        description: "Unbekannte Abteilungen (z. B. D99) sind ein bewusst eingebautes Datenproblem."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_departments')
                field: department_id
              config:
                severity: warn

  - name: stg_use_cases
    description: "Anwendungsfälle der KI mit Risikoklasse, Status und Dokumentationsstand."
    columns:
      - name: use_case_id
        data_tests: [unique, not_null]
      - name: risk_class
        data_tests:
          - accepted_values:
              arguments:
                values: ['minimal', 'begrenzt', 'hoch']

  - name: stg_usage_events
    description: "Jede KI-Anfrage genau einmal (Duplikate entfernt), mit Token-Mengen und Status."
    columns:
      - name: event_id
        description: "Nach dem Entfernen der Duplikate eindeutig."
        data_tests: [unique, not_null]
      - name: use_case_id
        description: "Fehlende Zuordnungen sind ein bewusst eingebautes Datenproblem."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['erfolg', 'fehler']
